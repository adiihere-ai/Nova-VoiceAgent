[project]
name = "nova-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Nameadiihere-ai", email = "adii.here.0165@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "livekit-agents>=1.8.3",
    "livekit-plugins-ai-coustics>=0.3.2",
    "livekit-plugins-openai>=1.8.3",
    "livekit-plugins-silero>=1.8.3",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
nova-agent = "nova_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
